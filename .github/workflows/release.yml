name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Every PR builds the release APK before it merges: JavaScript changes can break the release
  # bundle too, not only native or build config changes.
  pull_request:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - run: npm ci
      - run: npm run check:network

      # The fallback model ships inside the APK so the app works fully offline with no import
      # (guardrail 1). It is fetched here, on the runner, and never committed.
      - name: Fetch the bundled model
        run: ./scripts/fetch-slm.sh "$RUNNER_TEMP/slm/model.gguf"

      - name: Prebuild
        env:
          LABTRENDS_SLM_GGUF: ${{ runner.temp }}/slm/model.gguf
          EXPO_PUBLIC_BUNDLED_SLM: slm/model.gguf
        run: npx expo prebuild --platform android --no-install

      # Two workers and a capped heap keep the 16 GB runner from running out of memory during the
      # native (CMake/llama.cpp) compile. The log goes to a file so it survives a lost runner.
      - name: Build release APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2
          EXPO_PUBLIC_BUNDLED_SLM: slm/model.gguf
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore

      - name: Check the APK requests no network permission and ships arm64 only
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/aapt2" dump permissions "$APK" | tee permissions.txt
          if grep -E 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE|CHANGE_WIFI_STATE)' permissions.txt; then
            echo "::error::Release APK requests a network permission"
            exit 1
          fi
          ABIS=$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)
          echo "Native ABIs: ${ABIS:-none}"
          if [ -n "$ABIS" ] && [ "$ABIS" != "arm64-v8a" ]; then
            echo "::error::Release APK ships native libraries for ABIs other than arm64-v8a"
            exit 1
          fi
          if ! unzip -Z1 "$APK" | grep -qx 'assets/slm/model.gguf'; then
            echo "::error::Release APK does not contain the bundled model"
            exit 1
          fi
          # Stored, not deflated: llama.cpp reads the asset in place.
          unzip -Zv "$APK" assets/slm/model.gguf | grep -i 'compression method' | grep -qi 'none (stored)'

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          NAME="labtrends-${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          if [ -n "$KEYSTORE_BASE64" ]; then
            BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out "dist/$NAME.apk" "$APK"
            rm "$RUNNER_TEMP/release.jks"
            "$BT/apksigner" verify "dist/$NAME.apk"
          else
            echo "::warning::No signing secrets set; the APK is signed with the debug key"
            cp "$APK" "dist/$NAME-debugsigned.apk"
          fi
          cd dist && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: labtrends-apk
          path: dist/

      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "$GITHUB_REF_NAME" --notes "Release APK for arm64-v8a. Verify with SHA256SUMS."

  # Installs the APK built above on an Android emulator and runs the Maestro smoke flow in
  # .maestro/smoke.yaml. Screenshots, the Maestro report and logcat are uploaded either way.
  # The release APK is arm64-only and the CI emulator is x86_64 without ARM translation, so the
  # emulator test runs a second build of the same code for x86_64. It is never published.
  emulator-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build x86_64 release APK for the emulator
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.workers.max=2
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2 --console=plain
      - name: Check the build holds x86_64 libraries
        run: |
          unzip -Z1 android/app/build/outputs/apk/release/app-release.apk | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u | tee abis.txt
          grep -qx x86_64 abis.txt
      - uses: actions/upload-artifact@v4
        with:
          name: labtrends-emulator-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  emulator:
    needs: emulator-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: labtrends-emulator-apk
          path: apk
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run smoke test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./scripts/emulator-smoke.sh emulator-results
      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: |
            emulator-results/
            ~/.maestro/tests/
          if-no-files-found: ignore
