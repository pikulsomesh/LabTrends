name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # Also build on PRs that change native or build config, to catch breakage before a release.
  pull_request:
    paths:
      - app.json
      - eas.json
      - package.json
      - package-lock.json
      - plugins/**
      - modules/**
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm run check:network
      - run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Check the APK requests no network permission and ships arm64 only
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/aapt2" dump permissions "$APK" | tee permissions.txt
          if grep -E 'android\.permission\.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE|CHANGE_NETWORK_STATE|CHANGE_WIFI_STATE)' permissions.txt; then
            echo "::error::Release APK requests a network permission"
            exit 1
          fi
          ABIS=$(unzip -Z1 "$APK" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u)
          echo "Native ABIs: ${ABIS:-none}"
          if [ -n "$ABIS" ] && [ "$ABIS" != "arm64-v8a" ]; then
            echo "::error::Release APK ships native libraries for ABIs other than arm64-v8a"
            exit 1
          fi

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          NAME="labtrends-${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          if [ -n "$KEYSTORE_BASE64" ]; then
            BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out "dist/$NAME.apk" "$APK"
            rm "$RUNNER_TEMP/release.jks"
            "$BT/apksigner" verify "dist/$NAME.apk"
          else
            echo "::warning::No signing secrets set; the APK is signed with the debug key"
            cp "$APK" "dist/$NAME-debugsigned.apk"
          fi
          cd dist && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: labtrends-apk
          path: dist/

      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "$GITHUB_REF_NAME" --notes "Release APK for arm64-v8a. Verify with SHA256SUMS."
